name: Build and Deploy Router

on:
  push:
    branches:
      - main
      - develop
      - copilot/**
  pull_request:
    types: [closed]
    branches:
      - main
      - develop

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}
  cancel-in-progress: ${{ !(contains(fromJSON('["main","develop"]'), github.ref_name) || (github.event_name == 'pull_request' && contains(fromJSON('["main","develop"]'), github.event.pull_request.base.ref))) }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/pokenae-web

jobs:
  test:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build Storybook
        run: npm run build-storybook -- --quiet

      - name: Build Next.js
        env:
          CONTENT_SOURCE: fixture
        run: npm run build

  build-main:
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: test
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-build-push.yml
    with:
      image_tag: main
      environment: production
      azure_environment: production
      registry_server: ${{ vars.ACR_LOGIN_SERVER }}
    secrets:
      api_url: ${{ secrets.PROD_API_URL }}
      google_redirect_uri: ${{ secrets.PROD_GOOGLE_REDIRECT_URI }}
      google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
      azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
      azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
      azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  build-develop:
    if: github.event_name == 'push' && github.ref_name == 'develop'
    needs: test
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-build-push.yml
    with:
      image_tag: develop
      environment: development
      azure_environment: development
      registry_server: ${{ vars.ACR_LOGIN_SERVER }}
    secrets:
      api_url: ${{ secrets.DEV_API_URL }}
      google_redirect_uri: ${{ secrets.DEV_GOOGLE_REDIRECT_URI }}
      google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
      azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
      azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
      azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  deploy-main-vps:
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: build-main
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/reusable-deploy-vps.yml
    with:
      compose_file: docker-compose.prod.yml
      project_name: pokenae-prod
      container_name: pokenae-web-prod
      image_tag: main
      port: "3001"
    secrets:
      host: ${{ secrets.HOST }}
      username: ${{ secrets.USERNAME }}
      ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
      nextauth_url: ${{ secrets.PROD_NEXTAUTH_URL }}
      nextauth_secret: ${{ secrets.NEXTAUTH_SECRET }}
      google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
      google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      admin_emails: ${{ secrets.ADMIN_EMAILS }}
      github_app_id: ${{ secrets.GITHUB_APP_ID }}
      github_app_installation_id: ${{ secrets.GITHUB_APP_INSTALLATION_ID }}
      github_app_private_key_base64: ${{ secrets.GITHUB_APP_PRIVATE_KEY_BASE64 }}

  # =================================================================
  # Azure Container Apps デプロイ（develop ブランチ → ACA 開発環境）
  # reusable-deploy-azure-container-apps.yml はアプリ種類に依存しない
  # 汎用ワークフロー。環境変数は env_vars / secret_env_vars で指定。
  # =================================================================

  # =================================================================
  # Azure Container Apps デプロイ（copilot/** ブランチ → ACA Copilot 環境）
  # Copilot コーディングエージェントが作成するブランチへの push 時にデプロイ
  # =================================================================

  build-copilot:
    if: github.event_name == 'push' && startsWith(github.ref_name, 'copilot/')
    needs: test
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-build-push.yml
    with:
      image_tag: copilot
      environment: development
      azure_environment: copilot
      registry_server: ${{ vars.ACR_LOGIN_SERVER }}
    secrets:
      api_url: ${{ secrets.DEV_API_URL }}
      google_redirect_uri: ${{ secrets.DEV_GOOGLE_REDIRECT_URI }}
      google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
      azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
      azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
      azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  deploy-copilot-aca:
    if: github.event_name == 'push' && startsWith(github.ref_name, 'copilot/')
    needs: build-copilot
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-deploy-azure-container-apps.yml
    with:
      container_app_name: pokenae-web-copilot
      resource_group: ${{ vars.AZURE_RESOURCE_GROUP }}
      image: ${{ needs.build-copilot.outputs.image }}
      registry_server: ${{ vars.ACR_LOGIN_SERVER }}
      registry_identity: ${{ vars.ACR_PULL_IDENTITY_ID }}
      azure_environment: copilot
      env_vars: "NODE_ENV=production PORT=3000 NEXTAUTH_URL=${{ vars.COPILOT_NEXTAUTH_URL_ACA }} CONTENT_REPOSITORY_OWNER=p-o-ke-nae CONTENT_REPOSITORY_NAME=pokenae.Content CONTENT_REPOSITORY_REF=main"
    secrets:
      azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
      azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
      azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      secret_env_vars: "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }} GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }} ADMIN_EMAILS=${{ secrets.ADMIN_EMAILS }} GITHUB_APP_ID=${{ secrets.GITHUB_APP_ID }} GITHUB_APP_INSTALLATION_ID=${{ secrets.GITHUB_APP_INSTALLATION_ID }} GITHUB_APP_PRIVATE_KEY_BASE64=${{ secrets.GITHUB_APP_PRIVATE_KEY_BASE64 }}"

  deploy-develop-aca:
    if: github.event_name == 'push' && github.ref_name == 'develop'
    needs: build-develop
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-deploy-azure-container-apps.yml
    with:
      container_app_name: pokenae-web-develop
      resource_group: ${{ vars.AZURE_RESOURCE_GROUP }}
      image: ${{ needs.build-develop.outputs.image }}
      registry_server: ${{ vars.ACR_LOGIN_SERVER }}
      registry_identity: ${{ vars.ACR_PULL_IDENTITY_ID }}
      azure_environment: development
      env_vars: >-
        NODE_ENV=production
        PORT=3000
        NEXTAUTH_URL=${{ vars.DEV_NEXTAUTH_URL_ACA }}
        API_SERVICES=game-library-api
        API_SERVICE_GAME_LIBRARY_API_BASE_URL=${{ vars['DEV_GAME_LIBRARY_API_BASE_URL'] }}
        CONTENT_REPOSITORY_OWNER=p-o-ke-nae
        CONTENT_REPOSITORY_NAME=pokenae.Content
        CONTENT_REPOSITORY_REF=main
    secrets:
      azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
      azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
      azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      secret_env_vars: "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }} GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }} ADMIN_EMAILS=${{ secrets.ADMIN_EMAILS }} GITHUB_APP_ID=${{ secrets.GITHUB_APP_ID }} GITHUB_APP_INSTALLATION_ID=${{ secrets.GITHUB_APP_INSTALLATION_ID }} GITHUB_APP_PRIVATE_KEY_BASE64=${{ secrets.GITHUB_APP_PRIVATE_KEY_BASE64 }}"
