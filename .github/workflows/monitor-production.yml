name: Monitor Production

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check production health
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 5 \
            https://pokenae.com/api/health
