name: Reusable Build and Push

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
      environment:
        required: true
        type: string
      azure_environment:
        required: true
        type: string
        description: GitHub Environment used by the Azure OIDC federated credential
      registry_server:
        required: true
        type: string
        description: Azure Container Registry login server
    secrets:
      GOOGLE_CLIENT_ID:
        required: true
      AZURE_CREDENTIALS:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_SUBSCRIPTION_ID:
        required: false
    outputs:
      image_tag:
        description: Docker image tag
        value: ${{ jobs.build.outputs.image_tag }}
      image:
        description: Immutable fully qualified image name
        value: ${{ jobs.build.outputs.image }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.azure_environment }}
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_tag: ${{ steps.meta-info.outputs.image_tag }}
      image: ${{ steps.meta-info.outputs.image }}

    env:
      REGISTRY: ${{ inputs.registry_server }}
      IMAGE_NAME: pokenae-web
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/pokenae-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Validate application build configuration
        shell: bash
        env:
          API_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          GOOGLE_REDIRECT_URI: ${{ vars.NEXT_PUBLIC_GOOGLE_REDIRECT_URI }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          set -euo pipefail

          for variable_name in API_URL GOOGLE_REDIRECT_URI GOOGLE_CLIENT_ID; do
            if [ -z "${!variable_name:-}" ]; then
              echo "[ERROR] ${variable_name} is not configured in the selected GitHub Environment."
              exit 1
            fi
          done

          node -e "
            for (const name of ['API_URL', 'GOOGLE_REDIRECT_URI']) {
              const value = process.env[name];
              const url = new URL(value);
              if (url.protocol !== 'https:') {
                throw new Error(name + ' must use HTTPS');
              }
              if (url.username || url.password || url.hash) {
                throw new Error(name + ' must not contain credentials or a fragment');
              }
            }
          "

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Select Azure authentication mode
        id: azure-auth
        shell: bash
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail

          if [ -n "${AZURE_CREDENTIALS:-}" ]; then
            echo "mode=service-principal" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "${AZURE_CLIENT_ID:-}" ] || [ -z "${AZURE_TENANT_ID:-}" ] || [ -z "${AZURE_SUBSCRIPTION_ID:-}" ]; then
            echo "[ERROR] Set either azure_credentials or all Azure OIDC secrets."
            exit 1
          fi

          echo "mode=oidc" >> "$GITHUB_OUTPUT"

      - name: Login to Azure (service principal JSON)
        if: steps.azure-auth.outputs.mode == 'service-principal'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure (OIDC)
        if: steps.azure-auth.outputs.mode == 'oidc'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        shell: bash
        run: |
          set -euo pipefail
          registry_name="${REGISTRY%%.*}"
          az acr login --name "$registry_name"

      - name: Log in to GitHub Container Registry for legacy consumers
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set metadata output values
        id: meta-info
        run: |
          set -euo pipefail
          echo "image_tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=raw,value=sha-${{ github.sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_ENVIRONMENT=${{ inputs.environment }}
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_GOOGLE_REDIRECT_URI=${{ vars.NEXT_PUBLIC_GOOGLE_REDIRECT_URI }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
