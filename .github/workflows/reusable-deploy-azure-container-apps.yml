name: Reusable Deploy to Azure Container Apps
# ===========================================================================
# 汎用 ACA デプロイワークフロー
# - ACR からの pull は user-assigned managed identity を使用
# - GitHub Actions から ACR への push は OIDC/AcrPush を使用
# - アプリ環境変数は選択された GitHub Environment の Variables / Secrets を使用
# ===========================================================================

on:
  workflow_call:
    inputs:
      container_app_name:
        required: true
        type: string
        description: Azure Container App の名前
      resource_group:
        required: true
        type: string
        description: Azure リソースグループ名
      image:
        required: true
        type: string
        description: デプロイする ACR イメージの完全修飾名（タグ含む）
      registry_server:
        required: true
        type: string
        description: Azure Container Registry の login server
      registry_identity:
        required: true
        type: string
        description: ACA が ACR pull に使用する user-assigned managed identity の resource ID
      azure_environment:
        required: true
        type: string
        description: GitHub Environment used by the Azure OIDC federated credential
      health_check_path:
        required: false
        type: string
        default: "/"
        description: ヘルスチェックに使用するパス
      verify_timeout_seconds:
        required: false
        type: number
        default: 120
        description: デプロイ検証のタイムアウト（秒）
    secrets:
      AZURE_CREDENTIALS:
        required: false
        description: Azure Service Principal の JSON 認証情報
      AZURE_CLIENT_ID:
        required: false
        description: OIDC 用 Azure Client ID
      AZURE_TENANT_ID:
        required: false
        description: OIDC 用 Azure Tenant ID
      AZURE_SUBSCRIPTION_ID:
        required: false
        description: OIDC 用 Azure Subscription ID
      NEXTAUTH_SECRET:
        required: true
      GOOGLE_CLIENT_ID:
        required: true
      GOOGLE_CLIENT_SECRET:
        required: true
      ADMIN_EMAILS:
        required: false
      GH_APP_ID:
        required: false
      GH_APP_INSTALLATION_ID:
        required: false
      GH_APP_PRIVATE_KEY_BASE64:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.azure_environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Validate deployment inputs
        env:
          INPUT_CONTAINER_APP_NAME: ${{ inputs.container_app_name }}
          INPUT_RESOURCE_GROUP: ${{ inputs.resource_group }}
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_REGISTRY_SERVER: ${{ inputs.registry_server }}
          INPUT_REGISTRY_IDENTITY: ${{ inputs.registry_identity }}
        run: |
          set -euo pipefail
          errors=0
          for var in INPUT_CONTAINER_APP_NAME INPUT_RESOURCE_GROUP INPUT_IMAGE INPUT_REGISTRY_SERVER INPUT_REGISTRY_IDENTITY; do
            if [ -z "${!var}" ]; then
              echo "[ERROR] ${var} is required"
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            exit 1
          fi

      - name: Select Azure authentication mode
        id: azure-auth
        shell: bash
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail

          if [ -n "${AZURE_CREDENTIALS:-}" ]; then
            echo "mode=service-principal" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "${AZURE_CLIENT_ID:-}" ] || [ -z "${AZURE_TENANT_ID:-}" ] || [ -z "${AZURE_SUBSCRIPTION_ID:-}" ]; then
            echo "[ERROR] Set either azure_credentials or all Azure OIDC secrets."
            exit 1
          fi

          echo "mode=oidc" >> "$GITHUB_OUTPUT"

      - name: Login to Azure (service principal JSON)
        if: steps.azure-auth.outputs.mode == 'service-principal'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure (OIDC)
        if: steps.azure-auth.outputs.mode == 'oidc'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check out deployment scripts
        uses: actions/checkout@v4

      - name: Deploy to Azure Container Apps
        uses: azure/cli@v2
        env:
          SECRET_ENV_VARS: |
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            ADMIN_EMAILS=${{ secrets.ADMIN_EMAILS }}
            GITHUB_APP_ID=${{ secrets.GH_APP_ID }}
            GITHUB_APP_INSTALLATION_ID=${{ secrets.GH_APP_INSTALLATION_ID }}
            GITHUB_APP_PRIVATE_KEY_BASE64=${{ secrets.GH_APP_PRIVATE_KEY_BASE64 }}
          NEXTAUTH_URL: ${{ vars.NEXTAUTH_URL }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || vars.NEXT_PUBLIC_API_BASE_URL }}
          API_SERVICES: ${{ vars.API_SERVICES }}
          API_SERVICE_GAME_LIBRARY_API_BASE_URL: ${{ vars.API_SERVICE_GAME_LIBRARY_API_BASE_URL }}
          CONTENT_REPOSITORY_OWNER: ${{ vars.CONTENT_REPOSITORY_OWNER }}
          CONTENT_REPOSITORY_NAME: ${{ vars.CONTENT_REPOSITORY_NAME }}
          CONTENT_REPOSITORY_REF: ${{ vars.CONTENT_REPOSITORY_REF }}
          GAME_LIBRARY_API_VERSION_RANGE: ${{ vars.GAME_LIBRARY_API_VERSION_RANGE }}
        with:
          inlineScript: |
            set -euo pipefail
            source scripts/prepare-aca-secret-references.sh
            source scripts/prepare-aca-public-environment.sh
            prepare_aca_secret_references "${SECRET_ENV_VARS:-}"
            prepare_aca_public_environment

            echo "[INFO] Setting managed identity registry access for ${{ inputs.registry_server }}..."
            az containerapp registry set \
              --name "${{ inputs.container_app_name }}" \
              --resource-group "${{ inputs.resource_group }}" \
              --server "${{ inputs.registry_server }}" \
              --identity "${{ inputs.registry_identity }}"

            echo "[INFO] Setting ACA secrets..."
            az containerapp secret set \
              --name "${{ inputs.container_app_name }}" \
              --resource-group "${{ inputs.resource_group }}" \
              --secrets "${ACA_SECRET_ARGS[@]}"

            ENV_ARGS=("${ACA_PUBLIC_ENV_ARGS[@]}")
            ENV_ARGS+=("${ACA_SECRET_ENV_ARGS[@]}")

            UPDATE_ARGS=(
              containerapp update
              --name "${{ inputs.container_app_name }}"
              --resource-group "${{ inputs.resource_group }}"
              --image "${{ inputs.image }}"
            )
            if [ "${#ENV_ARGS[@]}" -gt 0 ]; then
              UPDATE_ARGS+=(--set-env-vars "${ENV_ARGS[@]}")
            fi

            echo "[INFO] Deploying image: ${{ inputs.image }}"
            az "${UPDATE_ARGS[@]}"

      - name: Verify deployment
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail

            APP="${{ inputs.container_app_name }}"
            RG="${{ inputs.resource_group }}"
            EXPECTED_IMAGE="${{ inputs.image }}"

            FQDN=$(az containerapp show \
              --name "${APP}" \
              --resource-group "${RG}" \
              --query "properties.configuration.ingress.fqdn" \
              --output tsv)

            if [ -z "${FQDN}" ]; then
              echo "[ERROR] Could not retrieve Container App FQDN"
              exit 1
            fi

            SITE_URL="https://${FQDN}${{ inputs.health_check_path }}"
            TIMEOUT=${{ inputs.verify_timeout_seconds }}
            INTERVAL=10
            MAX_ATTEMPTS=$((TIMEOUT / INTERVAL))

            show_diagnostics() {
              local revision="$1"
              echo "[INFO] Revision state:"
              az containerapp revision show \
                --name "${APP}" \
                --resource-group "${RG}" \
                --revision "${revision}" \
                --query "{name:name,healthState:properties.healthState,provisioningState:properties.provisioningState,replicas:properties.replicas,image:properties.template.containers[0].image}" \
                --output json || true

              echo "[INFO] Replica state:"
              az containerapp replica list \
                --name "${APP}" \
                --resource-group "${RG}" \
                --revision "${revision}" \
                --query "[].{name:name,runningState:properties.runningState,containers:properties.containers[].{name:name,ready:ready,runningState:runningState,runningStateDetails:runningStateDetails}}" \
                --output json || true

              echo "[INFO] Recent system events:"
              timeout 20s az containerapp logs show \
                --name "${APP}" \
                --resource-group "${RG}" \
                --type system \
                --tail 50 || true
            }

            echo "[INFO] Waiting for deployment to stabilize at ${SITE_URL}..."
            sleep 20

            for i in $(seq 1 "${MAX_ATTEMPTS}"); do
              REVISION=$(az containerapp show \
                --name "${APP}" \
                --resource-group "${RG}" \
                --query "properties.latestRevisionName" \
                --output tsv)
              READY_REVISION=$(az containerapp show \
                --name "${APP}" \
                --resource-group "${RG}" \
                --query "properties.latestReadyRevisionName" \
                --output tsv)
              REVISION_STATE=$(az containerapp revision show \
                --name "${APP}" \
                --resource-group "${RG}" \
                --revision "${REVISION}" \
                --query "[properties.provisioningState,properties.healthState] | join('|', @)" \
                --output tsv)
              ACTUAL_IMAGE=$(az containerapp revision show \
                --name "${APP}" \
                --resource-group "${RG}" \
                --revision "${REVISION}" \
                --query "properties.template.containers[0].image" \
                --output tsv)
              REPLICA_DETAILS=$(az containerapp replica list \
                --name "${APP}" \
                --resource-group "${RG}" \
                --revision "${REVISION}" \
                --query "[].properties.containers[].runningStateDetails" \
                --output tsv 2>/dev/null || true)

              if [ "${ACTUAL_IMAGE}" != "${EXPECTED_IMAGE}" ]; then
                echo "[ERROR] Latest revision uses '${ACTUAL_IMAGE}', expected '${EXPECTED_IMAGE}'."
                show_diagnostics "${REVISION}"
                exit 1
              fi

              if printf '%s' "${REPLICA_DETAILS}" | grep -Eq 'ImagePullUnauthorized|ImagePullFailure|ImagePullBackOff|InvalidImageName'; then
                echo "[ERROR] Container image pull failed: ${REPLICA_DETAILS}"
                show_diagnostics "${REVISION}"
                exit 1
              fi

              if [[ "${REVISION_STATE}" == Failed* || "${REVISION_STATE}" == *"|Unhealthy" ]]; then
                echo "[ERROR] Revision entered a failed or unhealthy state: ${REVISION_STATE}"
                show_diagnostics "${REVISION}"
                exit 1
              fi

              HTTP_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
                --connect-timeout 5 --max-time 15 "${SITE_URL}" 2>/dev/null || true)
              HTTP_STATUS="${HTTP_STATUS:-000}"
              if [ "${HTTP_STATUS}" -ge 200 ] \
                && [ "${HTTP_STATUS}" -lt 400 ] \
                && [[ "${REVISION_STATE}" == *"|Healthy" ]] \
                && [ "${READY_REVISION}" = "${REVISION}" ]; then
                echo "[SUCCESS] ${REVISION} is responding at ${SITE_URL} (HTTP ${HTTP_STATUS})"
                exit 0
              fi

              echo "[INFO] Waiting for ${REVISION} (${REVISION_STATE}, ready=${READY_REVISION})... (${i}/${MAX_ATTEMPTS}) HTTP status: ${HTTP_STATUS}"
              sleep "${INTERVAL}"
            done

            echo "[ERROR] Deployment verification timed out after ${TIMEOUT}s."
            show_diagnostics "${REVISION}"
            exit 1

      - name: Azure logout
        if: always()
        run: az logout
