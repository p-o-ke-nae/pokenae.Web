name: Reusable Deploy to VPS

on:
  workflow_call:
    inputs:
      deployment_environment:
        required: true
        type: string
      compose_file:
        required: true
        type: string
      runtime_env_file:
        required: true
        type: string
      project_name:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      port:
        required: true
        type: string
    secrets:
      host:
        required: true
      username:
        required: true
      ssh_private_key:
        required: true
      NEXTAUTH_SECRET:
        required: true
      GOOGLE_CLIENT_ID:
        required: true
      GOOGLE_CLIENT_SECRET:
        required: true
      ADMIN_EMAILS:
        required: false
      GH_APP_ID:
        required: false
      GH_APP_INSTALLATION_ID:
        required: false
      GH_APP_PRIVATE_KEY_BASE64:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.deployment_environment }}
    permissions:
      contents: read
      packages: read

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/pokenae-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          NEXTAUTH_URL: ${{ vars.NEXTAUTH_URL }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || vars.NEXT_PUBLIC_API_BASE_URL }}
          API_SERVICES: ${{ vars.API_SERVICES }}
          API_SERVICE_GAME_LIBRARY_API_BASE_URL: ${{ vars.API_SERVICE_GAME_LIBRARY_API_BASE_URL }}
          CONTENT_REPOSITORY_OWNER: ${{ vars.CONTENT_REPOSITORY_OWNER }}
          CONTENT_REPOSITORY_NAME: ${{ vars.CONTENT_REPOSITORY_NAME }}
          CONTENT_REPOSITORY_REF: ${{ vars.CONTENT_REPOSITORY_REF }}
          GAME_LIBRARY_API_VERSION_RANGE: ${{ vars.GAME_LIBRARY_API_VERSION_RANGE }}
        run: |
          set -euo pipefail
          trap 'rm -f .validated-runtime-env' EXIT
          node scripts/write-vps-runtime-env.mjs .validated-runtime-env

      - name: Create .ssh directory and add known hosts
        env:
          HOST: ${{ secrets.host }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 "$HOST" >> ~/.ssh/known_hosts

      - name: Transfer compose files to VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ssh_private_key }}
          HOST: ${{ secrets.host }}
          USERNAME: ${{ secrets.username }}
        run: |
          set -euo pipefail
          trap 'rm -f private_key' EXIT

          printf '%s' "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key

          ssh "$USERNAME@$HOST" -i private_key -p 22 "mkdir -p ~/pokenae-web/secrets"

          scp -i private_key -P 22 \
            docker-compose.yml \
            "${{ inputs.compose_file }}" \
            "$USERNAME@$HOST:~/pokenae-web/"

      - name: Create and transfer runtime environment to VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ssh_private_key }}
          HOST: ${{ secrets.host }}
          USERNAME: ${{ secrets.username }}
          RUNTIME_ENV_FILE: ${{ inputs.runtime_env_file }}
          NEXTAUTH_URL: ${{ vars.NEXTAUTH_URL }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || vars.NEXT_PUBLIC_API_BASE_URL }}
          API_SERVICES: ${{ vars.API_SERVICES }}
          API_SERVICE_GAME_LIBRARY_API_BASE_URL: ${{ vars.API_SERVICE_GAME_LIBRARY_API_BASE_URL }}
          CONTENT_REPOSITORY_OWNER: ${{ vars.CONTENT_REPOSITORY_OWNER }}
          CONTENT_REPOSITORY_NAME: ${{ vars.CONTENT_REPOSITORY_NAME }}
          CONTENT_REPOSITORY_REF: ${{ vars.CONTENT_REPOSITORY_REF }}
          GAME_LIBRARY_API_VERSION_RANGE: ${{ vars.GAME_LIBRARY_API_VERSION_RANGE }}
        run: |
          set -euo pipefail
          umask 077

          runtime_env_path=".deploy-runtime-env"
          remote_staging_name=".${RUNTIME_ENV_FILE}.upload-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'rm -f "$runtime_env_path" private_key' EXIT

          case "$RUNTIME_ENV_FILE" in
            ""|*[!A-Za-z0-9._-]*)
              echo "[ERROR] runtime_env_file must be a file name without path separators."
              exit 1
              ;;
          esac

          node scripts/write-vps-runtime-env.mjs "$runtime_env_path"

          printf '%s' "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key

          scp -i private_key -P 22 \
            "$runtime_env_path" \
            "$USERNAME@$HOST:~/pokenae-web/$remote_staging_name"

          printf -v remote_command \
            'RUNTIME_ENV_FILE=%q REMOTE_STAGING_NAME=%q bash -s' \
            "$RUNTIME_ENV_FILE" \
            "$remote_staging_name"

          ssh "$USERNAME@$HOST" -i private_key -p 22 "$remote_command" <<'EOF'
          set -euo pipefail

          cd ~/pokenae-web
          test -s "$REMOTE_STAGING_NAME"
          chmod 600 "$REMOTE_STAGING_NAME"
          EOF

      - name: Create secrets on VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ssh_private_key }}
          HOST: ${{ secrets.host }}
          USERNAME: ${{ secrets.username }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          GITHUB_APP_ID: ${{ secrets.GH_APP_ID }}
          GITHUB_APP_INSTALLATION_ID: ${{ secrets.GH_APP_INSTALLATION_ID }}
          GITHUB_APP_PRIVATE_KEY_BASE64: ${{ secrets.GH_APP_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077

          secret_upload_dir=".deploy-secrets"
          trap 'rm -rf "$secret_upload_dir" private_key' EXIT

          printf '%s' "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key

          rm -rf "$secret_upload_dir"
          mkdir -m 700 "$secret_upload_dir"
          printf '%s' "$NEXTAUTH_SECRET" > "$secret_upload_dir/nextauth_secret"
          printf '%s' "$GOOGLE_CLIENT_ID" > "$secret_upload_dir/google_client_id"
          printf '%s' "$GOOGLE_CLIENT_SECRET" > "$secret_upload_dir/google_client_secret"
          printf '%s' "$ADMIN_EMAILS" > "$secret_upload_dir/admin_emails"
          printf '%s' "$GITHUB_APP_ID" > "$secret_upload_dir/github_app_id"
          printf '%s' "$GITHUB_APP_INSTALLATION_ID" > "$secret_upload_dir/github_app_installation_id"
          printf '%s' "$GITHUB_APP_PRIVATE_KEY_BASE64" > "$secret_upload_dir/github_app_private_key_base64"
          chmod 600 "$secret_upload_dir"/*

          ssh "$USERNAME@$HOST" -i private_key -p 22 'set -eu
            secret_dir="$HOME/pokenae-web/secrets"
            deploy_owner="$(id -u):$(id -g)"
            install -d -m 700 "$secret_dir"
            chown "$deploy_owner" "$secret_dir"
            find "$secret_dir" -type f -exec chown "$deploy_owner" {} +
            find "$secret_dir" -type f -exec chmod 600 {} +
            chmod 700 "$secret_dir"
          '

          scp -i private_key -P 22 \
            "$secret_upload_dir"/* \
            "$USERNAME@$HOST:~/pokenae-web/secrets/"

          ssh "$USERNAME@$HOST" -i private_key -p 22 \
            'set -eu
              secret_dir="$HOME/pokenae-web/secrets"
              deploy_owner="$(id -u):$(id -g)"
              chown "$deploy_owner" "$secret_dir"
              find "$secret_dir" -type f -exec chown "$deploy_owner" {} +
              find "$secret_dir" -type f -exec chmod 600 {} +
              chmod 700 "$secret_dir"
            '

      - name: Deploy to VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ssh_private_key }}
          HOST: ${{ secrets.host }}
          USERNAME: ${{ secrets.username }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
          OVERRIDE_COMPOSE_FILE: ${{ inputs.compose_file }}
          RUNTIME_ENV_FILE: ${{ inputs.runtime_env_file }}
          RUNTIME_ENV_STAGING: .${{ inputs.runtime_env_file }}.upload-${{ github.run_id }}-${{ github.run_attempt }}
          PROJECT_NAME: ${{ inputs.project_name }}
          PORT: ${{ inputs.port }}
          DEPLOY_SHA: ${{ github.sha }}
          NEXTAUTH_URL: ${{ vars.NEXTAUTH_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          trap 'rm -f private_key' EXIT

          printf '%s' "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key

          printf -v remote_command \
            'IMAGE=%q OVERRIDE_COMPOSE_FILE=%q RUNTIME_ENV_FILE=%q RUNTIME_ENV_STAGING=%q PROJECT_NAME=%q PORT=%q DEPLOY_SHA=%q NEXTAUTH_URL=%q GITHUB_TOKEN=%q GITHUB_ACTOR=%q bash -s' \
            "$IMAGE" \
            "$OVERRIDE_COMPOSE_FILE" \
            "$RUNTIME_ENV_FILE" \
            "$RUNTIME_ENV_STAGING" \
            "$PROJECT_NAME" \
            "$PORT" \
            "$DEPLOY_SHA" \
            "$NEXTAUTH_URL" \
            "$GITHUB_TOKEN" \
            "$GITHUB_ACTOR"

          ssh "$USERNAME@$HOST" -i private_key -p 22 "$remote_command" <<'EOF'
          set -euo pipefail

          cd ~/pokenae-web

          get_container_id() {
            docker ps -aq \
              --filter "label=com.docker.compose.project=${PROJECT_NAME}" \
              --filter "label=com.docker.compose.service=app" |
              head -n 1
          }

          if [ -z "${NEXTAUTH_URL:-}" ]; then
            echo "[ERROR] nextauth_url is empty."
            exit 1
          fi

          LOCK_DIR="/tmp/pokenae-deploy-${PROJECT_NAME}.lock"
          lock_acquired=0
          for i in $(seq 1 60); do
            if mkdir "${LOCK_DIR}" 2>/dev/null; then
              lock_acquired=1
              break
            fi
            echo "[INFO] Waiting for deployment lock... (${i}/60)"
            sleep 2
          done
          if [ "$lock_acquired" -ne 1 ]; then
            echo "[ERROR] Failed to acquire deployment lock: ${LOCK_DIR}"
            exit 1
          fi

          runtime_env_backup="${RUNTIME_ENV_STAGING}.backup"
          runtime_env_installed=0
          runtime_env_validated=0
          cleanup() {
            status=$?
            trap - EXIT

            if [ "$runtime_env_installed" -eq 1 ] && [ "$runtime_env_validated" -eq 0 ]; then
              if [ -f "$runtime_env_backup" ]; then
                mv -f "$runtime_env_backup" "$RUNTIME_ENV_FILE"
              else
                rm -f "$RUNTIME_ENV_FILE"
              fi
            else
              rm -f "$runtime_env_backup"
            fi

            rm -f "$RUNTIME_ENV_STAGING"
            rmdir "${LOCK_DIR}" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT

          test -s "$RUNTIME_ENV_STAGING"
          if [ -f "$RUNTIME_ENV_FILE" ]; then
            cp -p "$RUNTIME_ENV_FILE" "$runtime_env_backup"
          fi
          mv -f "$RUNTIME_ENV_STAGING" "$RUNTIME_ENV_FILE"
          chmod 600 "$RUNTIME_ENV_FILE"
          runtime_env_installed=1

          echo "[INFO] Validating compose configuration..."
          IMAGE="${IMAGE}" \
          NEXTAUTH_URL="${NEXTAUTH_URL}" \
          docker compose \
            --env-file "${RUNTIME_ENV_FILE}" \
            -p "${PROJECT_NAME}" \
            -f docker-compose.yml \
            -f "${OVERRIDE_COMPOSE_FILE}" \
            config --quiet
          runtime_env_validated=1
          rm -f "$runtime_env_backup"

          echo "[INFO] Logging in to GitHub Container Registry..."
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

          echo "[INFO] Pulling image..."
          docker pull "${IMAGE}"

          echo "[INFO] Starting container with docker compose..."
          PREVIOUS_CONTAINER_ID="$(get_container_id)"
          PREVIOUS_IMAGE_ID="$(docker inspect --format='{{.Image}}' "${PREVIOUS_CONTAINER_ID}" 2>/dev/null || true)"
          if ! IMAGE="${IMAGE}" \
            NEXTAUTH_URL="${NEXTAUTH_URL}" \
            DEPLOY_SHA="${DEPLOY_SHA}" \
            docker compose \
            --env-file "${RUNTIME_ENV_FILE}" \
            -p "${PROJECT_NAME}" \
            -f docker-compose.yml \
            -f "${OVERRIDE_COMPOSE_FILE}" \
            up -d --no-build --force-recreate --remove-orphans; then
            echo "[ERROR] Failed to start the new container"
            if [ -n "${PREVIOUS_IMAGE_ID}" ]; then
              echo "[INFO] Restoring previous image..."
              IMAGE="${PREVIOUS_IMAGE_ID}" \
                NEXTAUTH_URL="${NEXTAUTH_URL}" \
                DEPLOY_SHA="${DEPLOY_SHA}" \
                docker compose \
                --env-file "${RUNTIME_ENV_FILE}" \
                -p "${PROJECT_NAME}" \
                -f docker-compose.yml \
                -f "${OVERRIDE_COMPOSE_FILE}" \
                up -d --no-build --force-recreate
              for i in $(seq 1 12); do
                if curl -sf "http://127.0.0.1:${PORT}/api/health" > /dev/null; then
                  echo "[INFO] Previous image restored"
                  break
                fi
                sleep 5
              done
            fi
            exit 1
          fi

          echo "[INFO] Waiting for the new container to become healthy..."
          for i in $(seq 1 24); do
            CONTAINER_ID="$(get_container_id)"
            CONTAINER_STATUS="$(docker inspect --format='{{.State.Status}}' "${CONTAINER_ID}" 2>/dev/null || echo not_found)"
            HEALTH_STATUS="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "${CONTAINER_ID}" 2>/dev/null || echo none)"
            if [ "${CONTAINER_STATUS}" = "running" ] &&
               [ "${HEALTH_STATUS}" = "healthy" ] &&
               curl -sf "http://127.0.0.1:${PORT}/api/health" > /dev/null; then
              echo "[SUCCESS] New container is healthy"
              docker image prune -f
              exit 0
            fi
            echo "[INFO] Waiting for healthy startup... (${i}/24) status=${CONTAINER_STATUS}, health=${HEALTH_STATUS}"
            sleep 5
          done

          echo "[ERROR] New container failed its health check"
          docker ps -a \
            --filter "label=com.docker.compose.project=${PROJECT_NAME}" \
            --filter "label=com.docker.compose.service=app" || true
          docker logs "$(get_container_id)" --tail 100 2>/dev/null || true

          if [ -n "${PREVIOUS_IMAGE_ID}" ]; then
            echo "[INFO] Restoring previous image..."
            IMAGE="${PREVIOUS_IMAGE_ID}" \
              NEXTAUTH_URL="${NEXTAUTH_URL}" \
              DEPLOY_SHA="${DEPLOY_SHA}" \
              docker compose \
              --env-file "${RUNTIME_ENV_FILE}" \
              -p "${PROJECT_NAME}" \
              -f docker-compose.yml \
              -f "${OVERRIDE_COMPOSE_FILE}" \
              up -d --no-build --force-recreate
          fi
          exit 1
          EOF

      - name: Verify deployment
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ssh_private_key }}
          HOST: ${{ secrets.host }}
          USERNAME: ${{ secrets.username }}
          SITE_URL: ${{ vars.NEXTAUTH_URL }}
        run: |
          set -euo pipefail
          trap 'rm -f private_key' EXIT

          printf '%s' "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key

          ssh "$USERNAME@$HOST" -i private_key -p 22 \
            "PROJECT_NAME=${{ inputs.project_name }} \
             PORT=${{ inputs.port }} \
             bash -s" <<'EOF'
          set -euo pipefail

          echo "[INFO] Verifying deployment..."

          get_container_id() {
            docker ps -aq \
              --filter "label=com.docker.compose.project=${PROJECT_NAME}" \
              --filter "label=com.docker.compose.service=app" |
              head -n 1
          }

          VERIFIED=false
          for i in $(seq 1 24); do
            CONTAINER_ID="$(get_container_id)"
            CONTAINER_STATUS=$(docker inspect --format='{{.State.Status}}' "${CONTAINER_ID}" 2>/dev/null || echo "not_found")
            HEALTH_STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "${CONTAINER_ID}" 2>/dev/null || echo "none")

            if [ "$CONTAINER_STATUS" = "running" ] && [ "$HEALTH_STATUS" != "unhealthy" ]; then
              if curl -sf "http://127.0.0.1:${PORT}/api/health" > /dev/null 2>&1; then
                echo "[SUCCESS] Application is responding on port ${PORT}"
                VERIFIED=true
                break
              fi
            fi

            echo "[INFO] Waiting for stable startup... (${i}/24) status=${CONTAINER_STATUS}, health=${HEALTH_STATUS}"
            sleep 5
          done

          if [ "${VERIFIED}" != "true" ]; then
            echo "[ERROR] Deployment verification timed out"
            docker ps -a \
              --filter "label=com.docker.compose.project=${PROJECT_NAME}" \
              --filter "label=com.docker.compose.service=app" || true
            docker logs "$(get_container_id)" --tail 100 2>/dev/null || true
            exit 1
          fi
          EOF

      - name: Verify application privilege drop
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ssh_private_key }}
          HOST: ${{ secrets.host }}
          USERNAME: ${{ secrets.username }}
          PROJECT_NAME: ${{ inputs.project_name }}
        run: |
          set -euo pipefail
          trap 'rm -f private_key' EXIT

          printf '%s' "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key

          printf -v remote_command 'PROJECT_NAME=%q bash -s' "$PROJECT_NAME"
          ssh "$USERNAME@$HOST" -i private_key -p 22 "$remote_command" <<'EOF'
          set -euo pipefail

          container_id="$(
            docker ps -q \
              --filter "label=com.docker.compose.project=${PROJECT_NAME}" \
              --filter "label=com.docker.compose.service=app" |
              head -n 1
          )"
          if [ -z "$container_id" ]; then
            echo "[ERROR] Application container was not found"
            exit 1
          fi

          if ! docker exec --user 1001:1001 "${container_id}" \
            /usr/local/bin/verify-process-user.sh 1001; then
            echo "[ERROR] Application privilege drop verification failed"
            docker top "${container_id}" -eo pid,user,args || true
            exit 1
          fi

          echo "[SUCCESS] Application privilege drop verified"
          EOF

      - name: Verify game-library API through public site
        env:
          SITE_URL: ${{ vars.NEXTAUTH_URL }}
        run: |
          set -euo pipefail

          # game-library API はゼロスケールのためコールドスタートを考慮してリトライする
          curl --fail --silent --show-error \
            --max-time 60 \
            --retry 6 --retry-all-errors --retry-delay 10 \
            "${SITE_URL%/}/api/public/account-type-masters" > /dev/null

          echo "[SUCCESS] game-library API is reachable through ${SITE_URL%/}"

      - name: Clean up deployment artifacts
        if: always()
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ssh_private_key }}
          HOST: ${{ secrets.host }}
          USERNAME: ${{ secrets.username }}
          RUNTIME_ENV_STAGING: .${{ inputs.runtime_env_file }}.upload-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          trap 'rm -f private_key' EXIT

          printf '%s' "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key
          printf -v remote_command \
            'RUNTIME_ENV_STAGING=%q bash -s' \
            "$RUNTIME_ENV_STAGING"

          ssh "$USERNAME@$HOST" -i private_key -p 22 "$remote_command" <<'EOF'
          set -euo pipefail
          rm -f \
            "$HOME/pokenae-web/$RUNTIME_ENV_STAGING" \
            "$HOME/pokenae-web/$RUNTIME_ENV_STAGING.backup"
          EOF
