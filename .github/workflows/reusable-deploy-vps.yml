name: Reusable Deploy to VPS

on:
  workflow_call:
    inputs:
      compose_file:
        required: true
        type: string
      project_name:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      port:
        required: true
        type: string
      api_services:
        required: false
        type: string
        default: game-library-api
      game_library_api_base_url:
        required: true
        type: string
    secrets:
      host:
        required: true
      username:
        required: true
      ssh_private_key:
        required: true
      nextauth_url:
        required: true
      nextauth_secret:
        required: true
      google_client_id:
        required: true
      google_client_secret:
        required: true
      api_url:
        required: true
      admin_allowed_emails:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/pokenae-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          GAME_LIBRARY_API_BASE_URL: ${{ inputs.game_library_api_base_url }}
        run: |
          set -euo pipefail

          if [ -z "$GAME_LIBRARY_API_BASE_URL" ]; then
            echo "::error::PROD_GAME_LIBRARY_API_BASE_URL is not configured"
            exit 1
          fi

          node -e "
            const url = new URL(process.env.GAME_LIBRARY_API_BASE_URL);
            if (url.protocol !== 'https:') {
              throw new Error('PROD_GAME_LIBRARY_API_BASE_URL must use HTTPS');
            }
            if (url.username || url.password || url.search || url.hash) {
              throw new Error('PROD_GAME_LIBRARY_API_BASE_URL must be a base URL without credentials, query, or fragment');
            }
          "

      - name: Create .ssh directory and add known hosts
        env:
          HOST: ${{ secrets.host }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 "$HOST" >> ~/.ssh/known_hosts

      - name: Transfer compose files to VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ssh_private_key }}
          HOST: ${{ secrets.host }}
          USERNAME: ${{ secrets.username }}
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key

          ssh "$USERNAME@$HOST" -i private_key -p 22 "mkdir -p ~/pokenae-web/secrets ~/pokenae-web/docker"

          scp -i private_key -P 22 \
            docker-compose.yml \
            "${{ inputs.compose_file }}" \
            "$USERNAME@$HOST:~/pokenae-web/"

          scp -i private_key -P 22 \
            docker/entrypoint.sh \
            "$USERNAME@$HOST:~/pokenae-web/docker/"

      - name: Create secrets on VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ssh_private_key }}
          HOST: ${{ secrets.host }}
          USERNAME: ${{ secrets.username }}
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key

          ssh "$USERNAME@$HOST" -i private_key -p 22 \
            "cd ~/pokenae-web && \
             printf '%s' '${{ secrets.nextauth_secret }}' > secrets/nextauth_secret && \
             printf '%s' '${{ secrets.google_client_id }}' > secrets/google_client_id && \
             printf '%s' '${{ secrets.google_client_secret }}' > secrets/google_client_secret && \
             chmod 644 secrets/*"

      - name: Deploy to VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ssh_private_key }}
          HOST: ${{ secrets.host }}
          USERNAME: ${{ secrets.username }}
          NEXTAUTH_URL: ${{ secrets.nextauth_url }}
          API_URL: ${{ secrets.api_url }}
          API_SERVICES: ${{ inputs.api_services }}
          GAME_LIBRARY_API_BASE_URL: ${{ inputs.game_library_api_base_url }}
          ADMIN_ALLOWED_EMAILS: ${{ secrets.admin_allowed_emails }}
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key

          NEXTAUTH_URL_B64="$(printf '%s' "$NEXTAUTH_URL" | base64 -w 0)"
          API_URL_B64="$(printf '%s' "$API_URL" | base64 -w 0)"
          API_SERVICES_B64="$(printf '%s' "$API_SERVICES" | base64 -w 0)"
          GAME_LIBRARY_API_BASE_URL_B64="$(printf '%s' "$GAME_LIBRARY_API_BASE_URL" | base64 -w 0)"
          ADMIN_ALLOWED_EMAILS_B64="$(printf '%s' "$ADMIN_ALLOWED_EMAILS" | base64 -w 0)"

          ssh "$USERNAME@$HOST" -i private_key -p 22 \
            "IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }} \
             OVERRIDE_COMPOSE_FILE=${{ inputs.compose_file }} \
             PROJECT_NAME=${{ inputs.project_name }} \
             PORT=${{ inputs.port }} \
             DEPLOY_SHA=${{ github.sha }} \
             NEXTAUTH_URL_B64=${NEXTAUTH_URL_B64} \
             API_URL_B64=${API_URL_B64} \
             API_SERVICES_B64=${API_SERVICES_B64} \
             GAME_LIBRARY_API_BASE_URL_B64=${GAME_LIBRARY_API_BASE_URL_B64} \
             ADMIN_ALLOWED_EMAILS_B64=${ADMIN_ALLOWED_EMAILS_B64} \
             GITHUB_TOKEN=${{ github.token }} \
             GITHUB_ACTOR=${{ github.actor }} \
             bash -s" <<'EOF'
          set -euo pipefail

          cd ~/pokenae-web
          export NEXTAUTH_URL="$(printf '%s' "${NEXTAUTH_URL_B64}" | base64 -d)"
          export NEXT_PUBLIC_API_BASE_URL="$(printf '%s' "${API_URL_B64}" | base64 -d)"
          export NEXT_PUBLIC_API_URL="${NEXT_PUBLIC_API_BASE_URL}"
          export API_SERVICES="$(printf '%s' "${API_SERVICES_B64}" | base64 -d)"
          export API_SERVICE_GAME_LIBRARY_API_BASE_URL="$(printf '%s' "${GAME_LIBRARY_API_BASE_URL_B64}" | base64 -d)"
          export ADMIN_ALLOWED_EMAILS="$(printf '%s' "${ADMIN_ALLOWED_EMAILS_B64}" | base64 -d)"

          get_container_id() {
            docker ps -aq \
              --filter "label=com.docker.compose.project=${PROJECT_NAME}" \
              --filter "label=com.docker.compose.service=app" |
              head -n 1
          }

          LOCK_DIR="/tmp/pokenae-deploy-${PROJECT_NAME}.lock"
          for i in $(seq 1 60); do
            if mkdir "${LOCK_DIR}" 2>/dev/null; then
              break
            fi
            echo "[INFO] Waiting for deployment lock... (${i}/60)"
            sleep 2
          done
          if [ ! -d "${LOCK_DIR}" ]; then
            echo "[ERROR] Failed to acquire deployment lock: ${LOCK_DIR}"
            exit 1
          fi
          trap 'rmdir "${LOCK_DIR}" 2>/dev/null || true' EXIT

          echo "[INFO] Logging in to GitHub Container Registry..."
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

          echo "[INFO] Pulling image..."
          docker pull "${IMAGE}"

          echo "[INFO] Validating compose configuration..."
          IMAGE="${IMAGE}" docker compose \
            -p "${PROJECT_NAME}" \
            -f docker-compose.yml \
            -f "${OVERRIDE_COMPOSE_FILE}" \
            config --quiet

          echo "[INFO] Starting container with docker compose..."
          PREVIOUS_CONTAINER_ID="$(get_container_id)"
          PREVIOUS_IMAGE_ID="$(docker inspect --format='{{.Image}}' "${PREVIOUS_CONTAINER_ID}" 2>/dev/null || true)"
          if ! IMAGE="${IMAGE}" docker compose \
            -p "${PROJECT_NAME}" \
            -f docker-compose.yml \
            -f "${OVERRIDE_COMPOSE_FILE}" \
            up -d --no-build --force-recreate --remove-orphans; then
            echo "[ERROR] Failed to start the new container"
            if [ -n "${PREVIOUS_IMAGE_ID}" ]; then
              echo "[INFO] Restoring previous image..."
              IMAGE="${PREVIOUS_IMAGE_ID}" docker compose \
                -p "${PROJECT_NAME}" \
                -f docker-compose.yml \
                -f "${OVERRIDE_COMPOSE_FILE}" \
                up -d --no-build --force-recreate
              for i in $(seq 1 12); do
                if curl -sf "http://127.0.0.1:${PORT}/api/auth/session" > /dev/null; then
                  echo "[INFO] Previous image restored"
                  break
                fi
                sleep 5
              done
            fi
            exit 1
          fi

          echo "[INFO] Waiting for the new container to become healthy..."
          for i in $(seq 1 24); do
            CONTAINER_ID="$(get_container_id)"
            CONTAINER_STATUS="$(docker inspect --format='{{.State.Status}}' "${CONTAINER_ID}" 2>/dev/null || echo not_found)"
            HEALTH_STATUS="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "${CONTAINER_ID}" 2>/dev/null || echo none)"
            if [ "${CONTAINER_STATUS}" = "running" ] &&
               [ "${HEALTH_STATUS}" = "healthy" ] &&
               curl -sf "http://127.0.0.1:${PORT}/api/health" > /dev/null; then
              echo "[SUCCESS] New container is healthy"
              docker image prune -f
              exit 0
            fi
            echo "[INFO] Waiting for healthy startup... (${i}/24) status=${CONTAINER_STATUS}, health=${HEALTH_STATUS}"
            sleep 5
          done

          echo "[ERROR] New container failed its health check"
          docker ps -a \
            --filter "label=com.docker.compose.project=${PROJECT_NAME}" \
            --filter "label=com.docker.compose.service=app" || true
          docker logs "$(get_container_id)" --tail 100 2>/dev/null || true

          if [ -n "${PREVIOUS_IMAGE_ID}" ]; then
            echo "[INFO] Restoring previous image..."
            IMAGE="${PREVIOUS_IMAGE_ID}" docker compose \
              -p "${PROJECT_NAME}" \
              -f docker-compose.yml \
              -f "${OVERRIDE_COMPOSE_FILE}" \
              up -d --no-build --force-recreate
          fi
          exit 1
          EOF

      - name: Verify deployment
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ssh_private_key }}
          HOST: ${{ secrets.host }}
          USERNAME: ${{ secrets.username }}
          SITE_URL: ${{ secrets.nextauth_url }}
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key

          ssh "$USERNAME@$HOST" -i private_key -p 22 \
            "PROJECT_NAME=${{ inputs.project_name }} \
             PORT=${{ inputs.port }} \
             bash -s" <<'EOF'
          set -euo pipefail

          echo "[INFO] Verifying deployment..."

          get_container_id() {
            docker ps -aq \
              --filter "label=com.docker.compose.project=${PROJECT_NAME}" \
              --filter "label=com.docker.compose.service=app" |
              head -n 1
          }

          VERIFIED=false
          for i in $(seq 1 24); do
            CONTAINER_ID="$(get_container_id)"
            CONTAINER_STATUS=$(docker inspect --format='{{.State.Status}}' "${CONTAINER_ID}" 2>/dev/null || echo "not_found")
            HEALTH_STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "${CONTAINER_ID}" 2>/dev/null || echo "none")

            if [ "$CONTAINER_STATUS" = "running" ] && [ "$HEALTH_STATUS" != "unhealthy" ]; then
              if curl -sf "http://127.0.0.1:${PORT}/api/health" > /dev/null 2>&1; then
                echo "[SUCCESS] Application is responding on port ${PORT}"
                VERIFIED=true
                break
              fi
            fi

            echo "[INFO] Waiting for stable startup... (${i}/24) status=${CONTAINER_STATUS}, health=${HEALTH_STATUS}"
            sleep 5
          done

          if [ "${VERIFIED}" != "true" ]; then
            echo "[ERROR] Deployment verification timed out"
            docker ps -a \
              --filter "label=com.docker.compose.project=${PROJECT_NAME}" \
              --filter "label=com.docker.compose.service=app" || true
            docker logs "$(get_container_id)" --tail 100 2>/dev/null || true
            exit 1
          fi
          EOF

          curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 5 \
            "${SITE_URL%/}/api/health" > /dev/null

          curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 5 \
            "${SITE_URL%/}/api/public/account-type-masters" > /dev/null
