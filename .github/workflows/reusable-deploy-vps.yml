name: Reusable Deploy to VPS

on:
  workflow_call:
    inputs:
      deployment_environment:
        required: true
        type: string
      compose_file:
        required: true
        type: string
      runtime_env_file:
        required: true
        type: string
      required_runtime_env_keys:
        required: false
        type: string
        default: ""
      project_name:
        required: true
        type: string
      container_name:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      port:
        required: true
        type: string
    secrets:
      host:
        required: true
      username:
        required: true
      ssh_private_key:
        required: true
      vps_runtime_env:
        required: false
        description: Supplied by the selected GitHub Environment as VPS_RUNTIME_ENV
      nextauth_url:
        required: true
      nextauth_secret:
        required: true
      google_client_id:
        required: true
      google_client_secret:
        required: true
      admin_emails:
        required: false
      github_app_id:
        required: false
      github_app_installation_id:
        required: false
      github_app_private_key_base64:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.deployment_environment }}
    permissions:
      contents: read
      packages: read

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/pokenae-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .ssh directory and add known hosts
        env:
          HOST: ${{ secrets.host }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 "$HOST" >> ~/.ssh/known_hosts

      - name: Transfer compose files to VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ssh_private_key }}
          HOST: ${{ secrets.host }}
          USERNAME: ${{ secrets.username }}
        run: |
          set -euo pipefail
          trap 'rm -f private_key' EXIT

          printf '%s' "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key

          ssh "$USERNAME@$HOST" -i private_key -p 22 "mkdir -p ~/pokenae-web/secrets"

          scp -i private_key -P 22 \
            docker-compose.yml \
            "${{ inputs.compose_file }}" \
            "$USERNAME@$HOST:~/pokenae-web/"

      - name: Create and transfer runtime environment to VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ssh_private_key }}
          HOST: ${{ secrets.host }}
          USERNAME: ${{ secrets.username }}
          RUNTIME_ENV_CONTENT: ${{ secrets.vps_runtime_env }}
          RUNTIME_ENV_FILE: ${{ inputs.runtime_env_file }}
          REQUIRED_RUNTIME_ENV_KEYS: ${{ inputs.required_runtime_env_keys }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.deployment_environment }}
        run: |
          set -euo pipefail
          umask 077

          runtime_env_path=".deploy-runtime-env"
          remote_staging_name=".${RUNTIME_ENV_FILE}.upload-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'rm -f "$runtime_env_path" private_key' EXIT

          case "$RUNTIME_ENV_FILE" in
            ""|*[!A-Za-z0-9._-]*)
              echo "[ERROR] runtime_env_file must be a file name without path separators."
              exit 1
              ;;
          esac

          if [ -z "${RUNTIME_ENV_CONTENT:-}" ]; then
            echo "[ERROR] VPS_RUNTIME_ENV is not configured in the ${DEPLOYMENT_ENVIRONMENT} GitHub Environment."
            exit 1
          fi

          printf '%s\n' "$RUNTIME_ENV_CONTENT" | sed 's/\r$//' > "$runtime_env_path"
          chmod 600 "$runtime_env_path"

          awk '
            /^[[:space:]]*($|#)/ { next }
            !/^[A-Za-z_][A-Za-z0-9_]*=/ {
              printf "[ERROR] Invalid runtime env syntax at line %d.\n", NR > "/dev/stderr"
              invalid = 1
              next
            }
            {
              key = $0
              sub(/=.*/, "", key)
              if (seen[key]++) {
                printf "[ERROR] Duplicate runtime env key: %s\n", key > "/dev/stderr"
                invalid = 1
              }
            }
            END { exit invalid }
          ' "$runtime_env_path"

          for key in $REQUIRED_RUNTIME_ENV_KEYS; do
            case "$key" in
              ""|[!A-Za-z_]*|*[!A-Za-z0-9_]*)
                echo "[ERROR] Invalid required runtime env key: $key"
                exit 1
                ;;
            esac

            if ! awk -v required_key="$key" '
              index($0, required_key "=") == 1 {
                value = substr($0, length(required_key) + 2)
                sub(/^[[:space:]]+/, "", value)
                sub(/[[:space:]]+$/, "", value)

                if (value ~ /^".*"$/ || value ~ /^\047.*\047$/) {
                  value = substr(value, 2, length(value) - 2)
                  sub(/^[[:space:]]+/, "", value)
                  sub(/[[:space:]]+$/, "", value)
                }

                if (length(value) > 0 && value !~ /^#/) {
                  found = 1
                }
              }
              END { exit !found }
            ' "$runtime_env_path"; then
              echo "[ERROR] Missing or empty required runtime env key: $key"
              exit 1
            fi
          done

          printf '%s' "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key

          scp -i private_key -P 22 \
            "$runtime_env_path" \
            "$USERNAME@$HOST:~/pokenae-web/$remote_staging_name"

          printf -v remote_command \
            'RUNTIME_ENV_FILE=%q REMOTE_STAGING_NAME=%q bash -s' \
            "$RUNTIME_ENV_FILE" \
            "$remote_staging_name"

          ssh "$USERNAME@$HOST" -i private_key -p 22 "$remote_command" <<'EOF'
          set -euo pipefail

          cd ~/pokenae-web
          test -s "$REMOTE_STAGING_NAME"
          chmod 600 "$REMOTE_STAGING_NAME"
          EOF

      - name: Create secrets on VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ssh_private_key }}
          HOST: ${{ secrets.host }}
          USERNAME: ${{ secrets.username }}
          NEXTAUTH_SECRET: ${{ secrets.nextauth_secret }}
          GOOGLE_CLIENT_ID: ${{ secrets.google_client_id }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.google_client_secret }}
          ADMIN_EMAILS: ${{ secrets.admin_emails }}
          GITHUB_APP_ID: ${{ secrets.github_app_id }}
          GITHUB_APP_INSTALLATION_ID: ${{ secrets.github_app_installation_id }}
          GITHUB_APP_PRIVATE_KEY_BASE64: ${{ secrets.github_app_private_key_base64 }}
        run: |
          set -euo pipefail
          umask 077

          secret_upload_dir=".deploy-secrets"
          trap 'rm -rf "$secret_upload_dir" private_key' EXIT

          printf '%s' "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key

          rm -rf "$secret_upload_dir"
          mkdir -m 700 "$secret_upload_dir"
          printf '%s' "$NEXTAUTH_SECRET" > "$secret_upload_dir/nextauth_secret"
          printf '%s' "$GOOGLE_CLIENT_ID" > "$secret_upload_dir/google_client_id"
          printf '%s' "$GOOGLE_CLIENT_SECRET" > "$secret_upload_dir/google_client_secret"
          printf '%s' "$ADMIN_EMAILS" > "$secret_upload_dir/admin_emails"
          printf '%s' "$GITHUB_APP_ID" > "$secret_upload_dir/github_app_id"
          printf '%s' "$GITHUB_APP_INSTALLATION_ID" > "$secret_upload_dir/github_app_installation_id"
          printf '%s' "$GITHUB_APP_PRIVATE_KEY_BASE64" > "$secret_upload_dir/github_app_private_key_base64"
          chmod 600 "$secret_upload_dir"/*

          ssh "$USERNAME@$HOST" -i private_key -p 22 'set -eu
            secret_dir="$HOME/pokenae-web/secrets"
            deploy_owner="$(id -u):$(id -g)"
            install -d -m 700 "$secret_dir"
            chown "$deploy_owner" "$secret_dir"
            find "$secret_dir" -type f -exec chown "$deploy_owner" {} +
            find "$secret_dir" -type f -exec chmod 600 {} +
            chmod 700 "$secret_dir"
          '

          scp -i private_key -P 22 \
            "$secret_upload_dir"/* \
            "$USERNAME@$HOST:~/pokenae-web/secrets/"

          ssh "$USERNAME@$HOST" -i private_key -p 22 \
            'set -eu
              secret_dir="$HOME/pokenae-web/secrets"
              deploy_owner="$(id -u):$(id -g)"
              chown "$deploy_owner" "$secret_dir"
              find "$secret_dir" -type f -exec chown "$deploy_owner" {} +
              find "$secret_dir" -type f -exec chmod 600 {} +
              chmod 700 "$secret_dir"
            '

      - name: Deploy to VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ssh_private_key }}
          HOST: ${{ secrets.host }}
          USERNAME: ${{ secrets.username }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
          OVERRIDE_COMPOSE_FILE: ${{ inputs.compose_file }}
          RUNTIME_ENV_FILE: ${{ inputs.runtime_env_file }}
          RUNTIME_ENV_STAGING: .${{ inputs.runtime_env_file }}.upload-${{ github.run_id }}-${{ github.run_attempt }}
          PROJECT_NAME: ${{ inputs.project_name }}
          CONTAINER_NAME: ${{ inputs.container_name }}
          NEXTAUTH_URL: ${{ secrets.nextauth_url }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          trap 'rm -f private_key' EXIT

          printf '%s' "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key

          printf -v remote_command \
            'IMAGE=%q OVERRIDE_COMPOSE_FILE=%q RUNTIME_ENV_FILE=%q RUNTIME_ENV_STAGING=%q PROJECT_NAME=%q CONTAINER_NAME=%q NEXTAUTH_URL=%q GITHUB_TOKEN=%q GITHUB_ACTOR=%q bash -s' \
            "$IMAGE" \
            "$OVERRIDE_COMPOSE_FILE" \
            "$RUNTIME_ENV_FILE" \
            "$RUNTIME_ENV_STAGING" \
            "$PROJECT_NAME" \
            "$CONTAINER_NAME" \
            "$NEXTAUTH_URL" \
            "$GITHUB_TOKEN" \
            "$GITHUB_ACTOR"

          ssh "$USERNAME@$HOST" -i private_key -p 22 "$remote_command" <<'EOF'
          set -euo pipefail

          cd ~/pokenae-web

          if [ -z "${NEXTAUTH_URL:-}" ]; then
            echo "[ERROR] nextauth_url is empty."
            exit 1
          fi

          LOCK_DIR="/tmp/pokenae-deploy-${PROJECT_NAME}.lock"
          lock_acquired=0
          for i in $(seq 1 60); do
            if mkdir "${LOCK_DIR}" 2>/dev/null; then
              lock_acquired=1
              break
            fi
            echo "[INFO] Waiting for deployment lock... (${i}/60)"
            sleep 2
          done
          if [ "$lock_acquired" -ne 1 ]; then
            echo "[ERROR] Failed to acquire deployment lock: ${LOCK_DIR}"
            exit 1
          fi

          runtime_env_backup="${RUNTIME_ENV_STAGING}.backup"
          runtime_env_installed=0
          runtime_env_validated=0
          cleanup() {
            status=$?
            trap - EXIT

            if [ "$runtime_env_installed" -eq 1 ] && [ "$runtime_env_validated" -eq 0 ]; then
              if [ -f "$runtime_env_backup" ]; then
                mv -f "$runtime_env_backup" "$RUNTIME_ENV_FILE"
              else
                rm -f "$RUNTIME_ENV_FILE"
              fi
            else
              rm -f "$runtime_env_backup"
            fi

            rm -f "$RUNTIME_ENV_STAGING"
            rmdir "${LOCK_DIR}" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT

          test -s "$RUNTIME_ENV_STAGING"
          if [ -f "$RUNTIME_ENV_FILE" ]; then
            cp -p "$RUNTIME_ENV_FILE" "$runtime_env_backup"
          fi
          mv -f "$RUNTIME_ENV_STAGING" "$RUNTIME_ENV_FILE"
          chmod 600 "$RUNTIME_ENV_FILE"
          runtime_env_installed=1

          echo "[INFO] Validating compose configuration..."
          IMAGE="${IMAGE}" \
          NEXTAUTH_URL="${NEXTAUTH_URL}" \
          docker compose \
            --env-file "${RUNTIME_ENV_FILE}" \
            -p "${PROJECT_NAME}" \
            -f docker-compose.yml \
            -f "${OVERRIDE_COMPOSE_FILE}" \
            config --quiet
          runtime_env_validated=1
          rm -f "$runtime_env_backup"

          echo "[INFO] Logging in to GitHub Container Registry..."
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

          echo "[INFO] Pulling image..."
          docker pull "${IMAGE}"

          echo "[INFO] Stopping existing compose project..."
          IMAGE="${IMAGE}" docker compose \
            --env-file "${RUNTIME_ENV_FILE}" \
            -p "${PROJECT_NAME}" \
            -f docker-compose.yml \
            -f "${OVERRIDE_COMPOSE_FILE}" \
            down --remove-orphans 2>/dev/null || true

          echo "[INFO] Removing stale container if exists..."
          for i in $(seq 1 10); do
            if docker ps -a --format '{{.Names}}' | grep -qx "${CONTAINER_NAME}"; then
              docker rm -f "${CONTAINER_NAME}" 2>/dev/null || true
              sleep 2
              continue
            fi
            break
          done

          if docker ps -a --format '{{.Names}}' | grep -qx "${CONTAINER_NAME}"; then
            echo "[ERROR] Stale container still exists: ${CONTAINER_NAME}"
            exit 1
          fi

          echo "[INFO] Starting container with docker compose..."
          IMAGE="${IMAGE}" \
          NEXTAUTH_URL="${NEXTAUTH_URL}" \
          docker compose \
            --env-file "${RUNTIME_ENV_FILE}" \
            -p "${PROJECT_NAME}" \
            -f docker-compose.yml \
            -f "${OVERRIDE_COMPOSE_FILE}" \
            up -d --no-build --force-recreate

          echo "[INFO] Cleaning up old images..."
          docker image prune -f
          EOF

      - name: Verify deployment
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ssh_private_key }}
          HOST: ${{ secrets.host }}
          USERNAME: ${{ secrets.username }}
        run: |
          set -euo pipefail
          trap 'rm -f private_key' EXIT

          printf '%s' "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key

          ssh "$USERNAME@$HOST" -i private_key -p 22 \
            "CONTAINER_NAME=${{ inputs.container_name }} \
             PORT=${{ inputs.port }} \
             bash -s" <<'EOF'
          set -euo pipefail

          echo "[INFO] Verifying deployment..."

          for i in $(seq 1 24); do
            CONTAINER_STATUS=$(docker inspect --format='{{.State.Status}}' "${CONTAINER_NAME}" 2>/dev/null || echo "not_found")
            HEALTH_STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "${CONTAINER_NAME}" 2>/dev/null || echo "none")

            if [ "$CONTAINER_STATUS" = "running" ] && [ "$HEALTH_STATUS" != "unhealthy" ]; then
              if curl -sf "http://localhost:${PORT}/" > /dev/null 2>&1; then
                echo "[SUCCESS] Application is responding on port ${PORT}"
                exit 0
              fi
            fi

            echo "[INFO] Waiting for stable startup... (${i}/24) status=${CONTAINER_STATUS}, health=${HEALTH_STATUS}"
            sleep 5
          done

          echo "[ERROR] Deployment verification timed out"
          docker ps -a --filter "name=${CONTAINER_NAME}" || true
          docker logs "${CONTAINER_NAME}" --tail 100 2>/dev/null || true
          exit 1
          EOF

      - name: Verify application privilege drop
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ssh_private_key }}
          HOST: ${{ secrets.host }}
          USERNAME: ${{ secrets.username }}
        run: |
          set -euo pipefail
          trap 'rm -f private_key' EXIT

          printf '%s' "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key

          ssh "$USERNAME@$HOST" -i private_key -p 22 \
            "CONTAINER_NAME=${{ inputs.container_name }} bash -s" <<'EOF'
          set -euo pipefail

          node_uid="$(
            docker exec "${CONTAINER_NAME}" sh -c '
              for status in /proc/[0-9]*/status; do
                [ "$(awk "/^Name:/ { print \$2 }" "$status")" = "node" ] || continue
                awk "/^Uid:/ { print \$2; exit }" "$status"
                exit
              done
            '
          )"

          if [ "${node_uid}" != "1001" ]; then
            echo "[ERROR] Node.js is not running as UID 1001"
            exit 1
          fi

          echo "[SUCCESS] Node.js is running as UID 1001"
          EOF

      - name: Clean up deployment artifacts
        if: always()
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ssh_private_key }}
          HOST: ${{ secrets.host }}
          USERNAME: ${{ secrets.username }}
          RUNTIME_ENV_STAGING: .${{ inputs.runtime_env_file }}.upload-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          trap 'rm -f private_key' EXIT

          printf '%s' "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key
          printf -v remote_command \
            'RUNTIME_ENV_STAGING=%q bash -s' \
            "$RUNTIME_ENV_STAGING"

          ssh "$USERNAME@$HOST" -i private_key -p 22 "$remote_command" <<'EOF'
          set -euo pipefail
          rm -f \
            "$HOME/pokenae-web/$RUNTIME_ENV_STAGING" \
            "$HOME/pokenae-web/$RUNTIME_ENV_STAGING.backup"
          EOF
