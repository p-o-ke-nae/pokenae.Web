# 本番環境用オーバーライド
# ローカル: docker compose -p pokenae-prod -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# CI/CD:    docker compose -p pokenae-prod -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  app:
    env_file:
      - .env.docker.production
    # CI/CD では GHCR から pull したイメージを使用（環境変数 IMAGE で指定）
    # ローカルでは build セクションが優先される
    image: ${IMAGE:-}
    build:
      target: runner
      args:
        NEXT_PUBLIC_ENVIRONMENT: production
    # root で 0600 の secrets を読み、entrypoint が nextjs:nodejs (1001:1001) へ降格する
    user: "0:0"
    container_name: pokenae-web-prod
    ports:
      - "127.0.0.1:${PORT:-3001}:3000"
    environment:
      NODE_ENV: production
      DEPLOY_SHA: ${DEPLOY_SHA:-unknown}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      USER_API_BASE_URL: ${USER_API_BASE_URL:-}
      API_SERVICES: ${API_SERVICES:-}
      API_SERVICE_GAME_LIBRARY_API_BASE_URL: ${API_SERVICE_GAME_LIBRARY_API_BASE_URL:-}
      API_SERVICE_1_BASE_URL: ${API_SERVICE_1_BASE_URL:-}
      API_SERVICE_2_BASE_URL: ${API_SERVICE_2_BASE_URL:-}
      API_SERVICE_3_BASE_URL: ${API_SERVICE_3_BASE_URL:-}
      API_SERVICE_1_API_KEY: ${API_SERVICE_1_API_KEY:-}
      API_SERVICE_2_API_KEY: ${API_SERVICE_2_API_KEY:-}
      API_SERVICE_3_API_KEY: ${API_SERVICE_3_API_KEY:-}
      USER_API_API_KEY: ${USER_API_API_KEY:-}
      CONTENT_REPOSITORY_OWNER: ${CONTENT_REPOSITORY_OWNER:-p-o-ke-nae}
      CONTENT_REPOSITORY_NAME: ${CONTENT_REPOSITORY_NAME:-pokenae.Content}
      CONTENT_REPOSITORY_REF: ${CONTENT_REPOSITORY_REF:-main}
      GAME_LIBRARY_API_VERSION_RANGE: ${GAME_LIBRARY_API_VERSION_RANGE:-">=1.0.0 <2.0.0"}
    # always: VPS 再起動後も自動起動し、クラッシュ時も常に再起動する
    restart: always
    # コンテナのリソース制限
    # Node.js RSS (V8ヒープ384M + 非ヒープ) を考慮して 768M に設定
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M
    # IPv6 の ::1 ではなく、Next.js が待ち受ける IPv4 ループバックを明示する。
    # Docker は unhealthy になってもコンテナを再起動しないため、連続 4 回失敗（約 2 分）した場合は
    # healthcheck 自身が Node.js プロセスを停止し、restart: always で自動復旧させる（ハング時の 502 継続対策）。
    # イメージ側のスクリプトに依存させないことで、旧イメージへのロールバック時も同じ挙動を保つ。
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          f=/tmp/.pokenae-health-failures;
          if wget --quiet --tries=1 --timeout=5 --output-document=/dev/null http://127.0.0.1:3000/api/health; then rm -f $$f; exit 0; fi;
          n=$$(( $$(cat $$f 2>/dev/null || echo 0) + 1 )); echo $$n > $$f;
          if [ $$n -ge 4 ]; then
          rm -f $$f;
          echo "[healthcheck] $$n consecutive failures; restarting Node.js process" > /proc/1/fd/2 2>/dev/null;
          kill -TERM -1; sleep 3; kill -KILL -1;
          fi;
          exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
