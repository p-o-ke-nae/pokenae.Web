# 本番環境用オーバーライド
# ローカル: docker compose -p pokenae-prod -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# CI/CD:    docker compose -p pokenae-prod -f docker-compose.yml -f docker-compose.prod.yml up -d
version: '3.8'

services:
  app:
    # CI/CD では GHCR から pull したイメージを使用（環境変数 IMAGE で指定）
    # ローカルでは build セクションが優先される
    image: ${IMAGE:-}
    build:
      target: runner
      args:
        NEXT_PUBLIC_ENVIRONMENT: production
    ports:
      - "127.0.0.1:${PORT:-3001}:3000"
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL is required}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-${NEXT_PUBLIC_API_BASE_URL}}
      USER_API_BASE_URL: ${USER_API_BASE_URL:-}
      API_SERVICES: ${API_SERVICES:-game-library-api}
      API_SERVICE_GAME_LIBRARY_API_BASE_URL: ${API_SERVICE_GAME_LIBRARY_API_BASE_URL:?API_SERVICE_GAME_LIBRARY_API_BASE_URL is required}
      API_SERVICE_1_BASE_URL: ${API_SERVICE_1_BASE_URL:-}
      API_SERVICE_2_BASE_URL: ${API_SERVICE_2_BASE_URL:-}
      API_SERVICE_3_BASE_URL: ${API_SERVICE_3_BASE_URL:-}
      API_SERVICE_1_API_KEY: ${API_SERVICE_1_API_KEY:-}
      API_SERVICE_2_API_KEY: ${API_SERVICE_2_API_KEY:-}
      API_SERVICE_3_API_KEY: ${API_SERVICE_3_API_KEY:-}
      USER_API_API_KEY: ${USER_API_API_KEY:-}
      ADMIN_ALLOWED_EMAILS: ${ADMIN_ALLOWED_EMAILS:-}
      ADMIN_EMAIL_ALLOWLIST: ${ADMIN_EMAIL_ALLOWLIST:-}
      DEPLOY_SHA: ${DEPLOY_SHA:-unknown}
    labels:
      org.opencontainers.image.revision: ${DEPLOY_SHA:-unknown}
    # always: VPS 再起動後も自動起動し、クラッシュ時も常に再起動する
    restart: always
    # コンテナのリソース制限
    # Node.js RSS (V8ヒープ384M + 非ヒープ) を考慮して 768M に設定
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M
    # IPv6 の ::1 ではなく、Next.js が待ち受ける IPv4 ループバックを明示する。
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --output-document=/dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
